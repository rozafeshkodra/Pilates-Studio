<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
     

 <header>
        <img class="imazhi1" src="spi-logo.svg" alt="logo-Pilates" onclick="window.location.href='Pilates.html'">
       <nav>
        <ul class="nav_links">

             <li><a href="services.html">Services</a></li>
             <li><a href="contact.html">Contact</a></li>
            <li><a href="booking.html">Book Online</a></li>
        </ul>
       </nav>
   </header>


<div class="container-contact">
        <div class="left-contact">
            <div class="left-content">
                <img src="images/pic8.avif" alt="Pilates Studio" class="studio-image-contact">
                <p class="quote">"Change happens through movement and movement heals."</p>
            </div>
        </div>

        <div class="right-contact">
            <h2>Get in Touch With Us</h2>

            <form class="form-contact" id="contactForm">
                <div class="row">
                    <div class="field">
                        <label>First name *</label>
                        <input type="text" id="firstName">
                        <small class="error-message" id="firstNameError"></small>
                    </div>
                    <div class="field">
                        <label>Last name *</label>
                        <input type="text" id="lastName">
                        <small class="error-message" id="lastNameError"></small>
                    </div>
                </div>

                <div class="field">
                    <label>Email *</label>
                    <input type="email" id="email">
                    <small class="error-message" id="emailError"></small>
                </div>

                <div class="field">
                    <label>Phone *</label>
                    <input type="tel" id="phone">
                </div>

                <div class="field">
                    <label>Message *</label>
                    <textarea id="message" ></textarea>
                    <small class="error-message" id="messageError"></small>
                </div>

                <button type="submit" class="submit-contact">Submit</button>
            </form>
        </div>
    </div>
<section class="footer">
    <div class="footer-majtas">
        <h2 class="logo-footer">Studio Pilates</h2>

        <p class="contact">123-456-7890</p>
        <p class="contact">studiopilates@gmail.com</p>
        <p class="adress">Rr.Muharrem Fejza</p>

        <div class="socials">
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-tiktok"></i>
        </div>
    </div>

    <div class="footer-djathtas">
        <h3>Connect With Us</h3>

        <label>Email</label>
        <input type="email" placeholder="Your email" class="emaili">

        <div class="checkbox">
            <input type="checkbox" id="subsribe">
            <label for="subsribe">Yes, subscribe me to your newsletter.</label>
        </div>

        <button class="submit">Submit</button>
    </div>
</section>

<p class="copyright">© 2025 Studio Pilates – All rights reserved.</p>

<script>
const form = document.getElementById("contactForm");

const firstName = document.getElementById("firstName");
const lastName = document.getElementById("lastName");
const email = document.getElementById("email");
const message = document.getElementById("message");

const firstNameError = document.getElementById("firstNameError");
const lastNameError = document.getElementById("lastNameError");
const emailError = document.getElementById("emailError");
const messageError = document.getElementById("messageError");

form.addEventListener("submit", function(e) {
    e.preventDefault();

    let valid = true;

    if (firstName.value.trim() === "") {
       firstNameError.textContent = "First name is required";
       valid = false;
    } else if (firstName.value.trim().length < 3) {
       firstNameError.textContent = "First name must be at least 3 characters";
       valid = false;
    } else {
       firstNameError.textContent = "";
    }

    if (lastName.value.trim() === "") {
       lastNameError.textContent = "Last name is required";
       valid = false;
    } else if (lastName.value.trim().length < 3) {
       lastNameError.textContent = "Last name must be at least 3 characters";
       valid = false;
    } else {
       lastNameError.textContent = "";
    }

    if (email.value.trim() === "") {
        emailError.textContent = "Email is required";
        valid = false;
    } else {
        emailError.textContent = "";
    }

    if (message.value.trim() === "") {
        messageError.textContent = "Message is required";
        valid = false;
    } else {
        messageError.textContent = "";
    }

    if (valid) {
        alert("Message sent successfully!");
        form.reset();
    }
});
</script>
</body>
</html>
