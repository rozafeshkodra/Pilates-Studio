<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body class="login-forma">

   <header>
    <img class="imazhi1" src="spi-logo.svg" alt="logo-Pilates" onclick="window.location.href='Pilates.html'">
    <nav>
        <ul class="nav_links">
            <li><a href="Pilates.php">Home</a></li>
             <li><a href="about.php">About</a></li>
             <li><a href="services.php">Services</a></li>
             <li><a href="contact.php">Contact</a></li>
            <li><a href="booking.php">Book Online</a></li>
        </ul>
    </nav>
</header>

    <div class="login-box">
        <div class="register-wrapper">
            <form action="">
                <h1>Register</h1>

                <div class="input-boxi">
                    <input type="text" placeholder="Full Name" required>
                    <i class='bxr  bx-user'></i>
                </div>

                <div class="input-boxi">
                    <input type="email" placeholder="Email" required>
                    <i class='bxr  bx-envelope'></i> 
                </div>
                 <div class="input-boxi">
                    <select required>
                        <option value="" disabled selected>Select Gender</option>
                        <option>Female</option>
                        <option>Male</option>
                        <option>Prefer not to say</option>
                    </select>
                    <i class='bxr  bx-caret-big-down'></i> 
                </div>
                <div class="input-boxi">
                    <input type="date" required>
                    <i class='bxr  bx-calendar'></i> 
                </div>

                <div class="input-boxi">
                    <input type="tel" placeholder="Phone Number" required>
                    <i class='bxr  bx-phone'></i> 
                </div>
                 <div class="input-boxi">
                    <input type="password" placeholder="Password" required>
                    <i class='bxr  bx-lock'></i> 
                </div>
                <div class="input-boxi">
                    <input type="password" placeholder="Confirm Password" required>
                    <i class='bxr  bx-lock'></i> 
                </div>

                <label class="Terms" style="display:flex; gap:8px; align-items:center; margin:10px 0;">  <!-- ketu pjesa e checkbox dhe teksti jan ne nje resht kom vendos inline css maspejt me kry pun -->
                    <input type="checkbox" required>
                    I accept the Terms & Conditions
                </label>

                <button type="submit" class="btn">Register</button>

                <div class="register-link">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>

            </form>
        </div>
    </div>


  <script>
const form = document.querySelector("form");
const fullName = form.querySelector("input[placeholder='Full Name']");
const email = form.querySelector("input[placeholder='Email']");
const phone = form.querySelector("input[placeholder='Phone Number']");
const password = form.querySelector("input[placeholder='Password']");
const confirmPassword = form.querySelector("input[placeholder='Confirm Password']");
const terms = form.querySelector("input[type='checkbox']");


[fullName, email, phone, password, confirmPassword].forEach(input => {
    const small = document.createElement("small");
    small.classList.add("error-message");
    input.parentElement.appendChild(small);
});

form.addEventListener("submit", function(e){
    e.preventDefault();
    let valid = true;

    
    if(fullName.value.trim().length < 3){
        fullName.parentElement.querySelector("small").textContent = "Full Name must be at least 3 characters";
        valid = false;
    } else {
        fullName.parentElement.querySelector("small").textContent = "";
    }

 
    const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if(!emailPattern.test(email.value.trim())){
        email.parentElement.querySelector("small").textContent = "Invalid email address";
        valid = false;
    } else {
        email.parentElement.querySelector("small").textContent = "";
    }

   
    const phonePattern = /^[0-9]{8,15}$/;
    if(!phonePattern.test(phone.value.trim())){
        phone.parentElement.querySelector("small").textContent = "Invalid phone number";
        valid = false;
    } else {
        phone.parentElement.querySelector("small").textContent = "";
    }

    
    if(password.value.trim().length < 6){
        password.parentElement.querySelector("small").textContent = "Password must be at least 6 characters";
        valid = false;
    } else {
        password.parentElement.querySelector("small").textContent = "";
    }

    
    if(password.value.trim() !== confirmPassword.value.trim()){
        confirmPassword.parentElement.querySelector("small").textContent = "Passwords do not match";
        valid = false;
    } else {
        confirmPassword.parentElement.querySelector("small").textContent = "";
    }

    
    if(!terms.checked){
        alert("You must accept the Terms & Conditions");
        valid = false;
    }

    if(valid){
        
        window.location.href = "login.html";
    }
});
</script>
</body>
</html>
